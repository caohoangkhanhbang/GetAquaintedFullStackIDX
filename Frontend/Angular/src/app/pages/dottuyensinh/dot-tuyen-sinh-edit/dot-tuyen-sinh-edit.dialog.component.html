<div class="jee-tutorial card">
    <div class="card-header">
        <div class="card-title">
            <h4 class="modal-title" id="modal-basic-title">{{getTitle()}}</h4>
        </div>

        <div class="card-toolbar">
            <div class="d-flex justify-content-end">
                <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
            </div>
        </div>
    </div>
    <div class="jee-tutorial card">
        <div class="card-body">
            <div [formGroup]="itemForm" class="m-form m-form--group-seperator-dashed">
                <div class="d-flex flex-column scroll-y me-n7 pe-7 mw-650px">
                    <div class="collapse show">
                        <div class="row">
                            <div class="fv-row mb-7 col col-6">
                                <label class="required fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.tendotTS' | translate
                                    }}</label>
                                <input cdkFocusInitial #focusInput type="text"
                                    class="form-control form-control-solid class-batbuoc input-batbuoc"
                                    formControlName="TenDotTS" required />
                            </div>

                            <div class="fv-row mb-7 col col-6">
                                <label class="required fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.dot' | translate
                                    }}</label>
                                <input type="number" class="form-control form-control-solid class-batbuoc input-batbuoc"
                                    formControlName="Dot" min="1" (keydown)="validateNumber($event)" required />
                            </div>
                        </div>

                        <div class="row">
                            <div class="fv-row mb-7 col col-6">
                                <label class="required fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.namhoc' | translate
                                    }}</label>
                                <mat-select class="form-control form-control-solid input-batbuoc"
                                    formControlName="DOTTUYENSINHDaoTao" required>
                                    <mat-option [value]="0">{{ 'DOTTUYENSINH.khongchon' | translate }}</mat-option>
                                    <mat-option *ngFor="let DOTTUYENSINH of listDOTTUYENSINHDaoTao"
                                        [value]="DOTTUYENSINH.NamHoc">
                                        {{ DOTTUYENSINH.NamHoc}}
                                    </mat-option>
                                </mat-select>
                            </div>

                            <div class="fv-row mb-7 col col-6">
                                <label class="required fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.khoahoc' | translate
                                    }}</label>
                                <mat-select class="form-control form-control-solid input-batbuoc"
                                    formControlName="DOTTUYENSINHDaoTao" required>
                                    <mat-option [value]="0">{{ 'DOTTUYENSINH.khongchon' | translate }}</mat-option>
                                    <mat-option *ngFor="let DOTTUYENSINH of listDOTTUYENSINHDaoTao"
                                        [value]="DOTTUYENSINH.KhoaHoc">
                                        {{ DOTTUYENSINH.KhoaHoc}}
                                    </mat-option>
                                </mat-select>
                            </div>
                        </div>

                        <!-- thẻ ngày -->
                        <div class="row">
                            <div class="fv-row mb-7 col col-6">
                                <label class="fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.thoigiannhanHS_tungay' | translate
                                    }}</label>
                                <input type="date" class="form-control form-control-solid"
                                    formControlName="ThoiGianNhanHSTuNgay" required />
                            </div>

                            <div class="fv-row mb-7 col col-6">
                                <label class="fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.thoigiannhanHS_denngay' |
                                    translate }}</label>
                                <input type="date" class="form-control form-control-solid"
                                    formControlName="ThoiGianNhanHSDenNgay" required />
                            </div>
                        </div>

                        <div class="row">
                            <div class="fv-row mb-7 col col-6">
                                <label class="fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.thoigianlayHS_tungay' | translate
                                    }}</label>
                                <input type="date" class="form-control form-control-solid"
                                    formControlName="ThoiGianLayHSTuNgay" required />
                            </div>

                            <div class="fv-row mb-7 col col-6">
                                <label class="fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.thoigianlayHS_denngay' | translate
                                    }}</label>
                                <input type="date" class="form-control form-control-solid"
                                    formControlName="ThoiGianLayHSDenNgay" required />
                            </div>
                        </div>

                        <div class="row">
                            <div class="fv-row mb-7 col col-6">
                                <label class="fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.ngayinGBTT' | translate }}</label>
                                <input type="date" class="form-control form-control-solid" formControlName="NgayInGBTT"
                                    required />
                            </div>

                            <div class="fv-row mb-7 col col-6">
                                <label class="fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.ngaynhaphocDK' | translate
                                    }}</label>
                                <input type="date" class="form-control form-control-solid"
                                    formControlName="NgayNhapHocDK" required />
                            </div>
                        </div>

                        <!-- <div class="fv-row mb-7"> -->
                        <!-- <div class="row"> -->
                        <label class="fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.hienthi' | translate}}</label>
                        <!-- </div> -->
                        <input type="checkbox" name="" id="" formControlName="HienThi" checked>

                        <div class="fv-row mb-7">
                            <label class="fw-semibold fs-6 mb-2">{{ 'DOTTUYENSINH.ghichu' |
                                translate }}</label>
                            <textarea class="form-control form-control-solid" formControlName="GhiChu" rows="2"
                                required></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card-footer">
        <button type="reset" id="kt_modal_update_customer_cancel" class="btn btn-light me-3" (click)="close()">
            {{'COMMON.trolai' | translate}}
        </button>
        <!--end::Button-->
        <ng-container *ngIf="!isView">
            <!--begin::Button-->
            <button type="submit" id="kt_modal_update_customer_submit" class="btn jee_btn-addclose me-3"
                (click)="onSubmit(true)" [disabled]="disabledBtn">
                <span class="indicator-label">
                    {{'COMMON.luudong' | translate}}
                </span>
                <span class="indicator-progress">
                    {{'COMMON.dangxuly' | translate}}<span
                        class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
            </button>

            <!--begin::Button-->
            <button type="submit" id="kt_modal_update_customer_submit" class="btn jee_btn-addcontinue"
                (click)="onSubmit(false)" *ngIf="!viewLoading" [disabled]="disabledBtn">

                            <rect x="0" y="0" width="24" height="24" />

                                fill="#000000" opacity="0.3" />
                        </g>
                    </svg><!--end::Svg Icon--></span>
                <span class="indicator-label">
                    {{'COMMON.luutieptuc' | translate}}
                </span>
                <span class="indicator-progress">
                    {{'COMMON.dangxuly' | translate}}<span
                        class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
            </button>
        </ng-container>
    </div>
</div>
