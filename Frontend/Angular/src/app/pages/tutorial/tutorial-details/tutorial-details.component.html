<div class="card card-flush mb-6 mb-xl-9">
    <form #myForm="ngForm" (ngSubmit)="onSubmit($event, myForm)">
        <!--begin::Card header-->
        <div class="card-header mt-6">
            <!--begin::Card title-->
            <div class="card-title flex-column">
                <h2 class="mb-1">{{getTitle()}}</h2>
            </div>
            <!--end::Card title-->
            <!--begin::Card toolbar-->
            <div class="card-toolbar">
                <button type="button" class="btn btn-light me-3" (click)="close()">
                    <span>{{'COMMON.trolai' | translate}}</span>
                </button>&nbsp;
                <button type="submit" class="btn btn-primary" [attr.data-kt-indicator]="isLoading ? 'on' : 'off'">
                    <span class="indicator-label">
                        Lưu
                    </span>
                    <span class="indicator-progress">
                        Please wait... <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </button>
            </div>
            <!--end::Card toolbar-->
        </div>
        <!--end::Card header-->
        <!--begin::Card body-->
        <div class="card-body d-flex flex-column">
            <div class="d-flex flex-column scroll-y me-n7 pe-7 mw-650px" id="kt_modal_update_customer_scroll"
                data-kt-scroll="true" data-kt-scroll-activate="{default: false, lg: true}"
                data-kt-scroll-max-height="auto" data-kt-scroll-dependencies="#kt_modal_update_customer_header"
                data-kt-scroll-wrappers="#kt_modal_update_customer_scroll" data-kt-scroll-offset="300px">

                <!--begin::User form-->
                <div class="collapse show">
                    <!--begin::Input group-->
                    <div class="fv-row mb-7">
                        <!--begin::Label-->
                        <label class="required fw-semibold fs-6 mb-2">Code</label>
                        <!--end::Label-->
                        <!--begin::Input-->
                        <input type="text" class="form-control form-control-solid" name="code"
                            [(ngModel)]="itemModel.EventCode" #code="ngModel" required minlength="4" />
                        <div *ngIf="myForm.submitted && myForm.invalid"
                            class="fv-plugins-message-container fv-plugins-message-container--enabled invalid-feedback">
                            <div *ngIf="code.errors?.['required']">Code is required</div>
                            <div *ngIf="code.errors?.['minlength']">Code must be at least 4 characters long</div>
                        </div>
                        <!--end::Input-->
                    </div>
                    <!--end::Input group-->
                    <!--begin::Input group-->
                    <div class="fv-row mb-7">
                        <!--begin::Label-->
                        <label class="required fw-semibold fs-6 mb-2">
                            Name
                        </label>
                        <!--end::Label-->
                        <!--begin::Input-->
                        <input type="text" class="form-control form-control-solid" name="name"
                            [(ngModel)]="itemModel.EventName" #name="ngModel" required />
                        <div *ngIf="myForm.submitted && myForm.invalid"
                            class="fv-plugins-message-container fv-plugins-message-container--enabled invalid-feedback">
                            <div *ngIf="name.errors?.['required']">Name is required</div>
                        </div>
                        <!--end::Input-->
                    </div>
                    <!--end::Input group-->
                    <!--begin::Input group-->
                    <div class="fv-row mb-7">
                        <!--begin::Label-->
                        <label class="required fw-semibold fs-6 mb-2">
                            Date
                        </label>
                        <!--end::Label-->
                        <!--begin::Input-->
                        <div style="display: flex;">
                            <input class="form-control form-control-solid" name="date" matInput
                                [matDatepicker]="picker" placeholder="Choose a date" [(ngModel)]="selectedDate"
                                #date="ngModel" required >
                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-datepicker #picker></mat-datepicker>
                        </div>
                        <div *ngIf="myForm.submitted && myForm.invalid"
                            class="fv-plugins-message-container fv-plugins-message-container--enabled invalid-feedback">
                            <div *ngIf="date.errors?.['required']">Date is required</div>
                        </div>
                        <!--end::Input-->
                    </div>
                    <!--end::Input group-->
                </div>
                <!--end::User form-->
            </div>
        </div>
        <!--end::Card body-->
    </form>
</div>

<swal #noticeSwal [swalOptions]="swalOptions">
</swal>
