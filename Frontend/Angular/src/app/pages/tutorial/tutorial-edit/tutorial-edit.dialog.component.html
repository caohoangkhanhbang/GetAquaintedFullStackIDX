<div class="jee-tutorial card">
	<div class="card-header">
		<div class="card-title">
			<h4 class="modal-title" id="modal-basic-title">{{getTitle()}}</h4>
		</div>

		<div class="card-toolbar">
			<div class="d-flex justify-content-end">
				<button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
			</div>
		</div>
	</div>

	<div class="card-body">
		<div [formGroup]="itemForm" class="m-form m-form--group-seperator-dashed">
			<div class="d-flex flex-column scroll-y me-n7 pe-7">
				<div class="row collapse show">
					<div class="col-md-6">
						<div class="fv-row mb-7">
							<label class="required fw-semibold fs-6 mb-2">Code</label>
							<input cdkFocusInitial #focusInput type="text"
								class="form-control form-control-solid class-batbuoc input-batbuoc"
								formControlName="EventCode" required />
						</div>

						<div class="fv-row mb-7">
							<label class="required fw-semibold fs-6 mb-2">
								Date
							</label>
							<div style="display: flex; position: relative;">
								<input readonly class="form-control form-control-solid  class-batbuoc input-batbuoc"
									name="date" matInput [matDatepicker]="picker" formControlName="EventDate" required>
								<mat-datepicker-toggle style="position: absolute; right: 0;" matSuffix
									[for]="picker"></mat-datepicker-toggle>
								<mat-datepicker #picker></mat-datepicker>
							</div>
						</div>

						<div class="fv-row mb-7">
							<label class="required fw-semibold fs-6 mb-2">
								Select search
							</label>
							<div style="display: flex;">
								<mat-select required
									class="form-control form-control-solid  class-batbuoc input-batbuoc"
									formControlName="EventSelectsearch">
									<mat-option>
										<ngx-mat-select-search [formControl]="bankTuGio" [placeholderLabel]="''"
											[noEntriesFoundLabel]="''">
										</ngx-mat-select-search>
									</mat-option>
									<mat-option value="{{itemCate.Gio}}"
										*ngFor="let itemCate of filteredBanksTuGio | async">
										{{ itemCate.Gio }}
									</mat-option>
								</mat-select>
							</div>
						</div>
					</div>
					<div class="col-md-6">
						<div class="fv-row mb-7">
							<label class="required fw-semibold fs-6 mb-2">
								Name
							</label>
							<input type="text" class="form-control form-control-solid class-batbuoc input-batbuoc"
								formControlName="EventName" required />
						</div>

						<div class="fv-row mb-7">
							<label class="required fw-semibold fs-6 mb-2">
								Select
							</label>
							<div style="display: flex;">
								<mat-select required
									class="form-control form-control-solid  class-batbuoc input-batbuoc"
									formControlName="EventSelect">
									<mat-option value="{{itemCate.Gio}}" *ngFor="let itemCate of GioNghi">
										{{ itemCate.Gio }}
									</mat-option>
								</mat-select>
							</div>
						</div>

						<div class="fv-row mb-7">
							<label class="required fw-semibold fs-6 mb-2">
								Textarea
							</label>
							<div style="display: flex;">
								<textarea class="form-control form-control-solid class-batbuoc input-batbuoc"
									formControlName="EventTextarea" required></textarea>
							</div>
						</div>
					</div>

					

					<div class="fv-row mb-7">
						<app-upload-file-custom [Config]="uploadFileConfig" [FileServerList]="fileServerList"
							(ListFilesDelete)="GetListFileDelete($event)"
							(ListFilesUpload)="GetListFileUploadNew($event)"
							(ListFileTuKhoLuuTru)="GetListFileUploadTuKhoLuuTruNew($event)"></app-upload-file-custom>
					</div>
				</div>
				
			</div>
		</div>
	</div>

	<div class="card-footer">
		<button type="reset" id="kt_modal_update_customer_cancel" class="btn btn-light me-3" (click)="close()">
			Trở lại
		</button>
		<!--end::Button-->

		<!--begin::Button-->
		<button type="submit" id="kt_modal_update_customer_submit" class="btn jee_btn-addclose me-3"
			(click)="onSubmit(true)" [disabled]="disabledBtn">
			<span class="indicator-label">
				{{'COMMON.luudong' | translate}}
			</span>
			<span class="indicator-progress">
				{{'COMMON.dangxuly' | translate}}<span
					class="spinner-border spinner-border-sm align-middle ms-2"></span>
			</span>
		</button>

			<span class="indicator-label">
				{{'COMMON.luutieptuc' | translate}}
			</span>
			<span class="indicator-progress">
				{{'COMMON.dangxuly' | translate}}<span
					class="spinner-border spinner-border-sm align-middle ms-2"></span>
			</span>
		</button>
	</div>
</div>
