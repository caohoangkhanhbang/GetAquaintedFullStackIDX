<!--begin::Search-->
<div *ngIf="false" class="app-navbar-item align-items-stretch" [ngClass]="itemClass">
  <!--begin::Search-->
  <div id="kt_header_search" class="header-search d-flex align-items-stretch" data-kt-search-keypress="true"
    data-kt-search-min-length="2" data-kt-search-enter="enter" data-kt-search-layout="menu"
    data-kt-menu-trigger="{default: 'hover'}" data-kt-menu-overflow="false" data-kt-menu-permanent="true"
    data-kt-menu-placement="bottom-end" data-kt-search="true">
    <!--begin::Search toggle-->
    <div class="d-flex align-items-center" data-kt-search-element="toggle" id="kt_header_search_toggle">
      <div [ngClass]="btnClass">
        <app-keenicon name="magnifier" [class]="btnIconClass"></app-keenicon>
      </div>
    </div>
    <!--end::Search toggle-->
    <app-search-result-inner data-kt-search-element="content" data-kt-menu="true"
      class="menu menu-sub menu-sub-dropdown p-7 w-325px w-md-375px"></app-search-result-inner>
  </div>

</div>
<!--end::Search-->

<!--begin::Activities-->
<div *ngIf="false" class="app-navbar-item" [ngClass]="itemClass">
  <!--begin::Drawer toggle-->
  <div [ngClass]="btnClass" id="kt_activities_toggle">
    <app-keenicon name="messages" class="fs-2"></app-keenicon>
  </div>
  <!--end::Drawer toggle-->
</div>
<!--end::Activities-->

<!--begin::Notifications-->
<div *ngIf="false" class="app-navbar-item" [ngClass]="itemClass">
  <!--begin::Menu- wrapper-->
  <div [ngClass]="btnClass" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-attach="parent"
    data-kt-menu-placement="bottom-end">
    <app-keenicon name="notification-status" class="fs-2"></app-keenicon>
  </div>
  <app-notifications-inner></app-notifications-inner>
  <!--end::Menu wrapper-->
</div>
<!--end::Notifications-->

<!--begin::Chat-->
<div *ngIf="false" class="app-navbar-item" [ngClass]="itemClass">
  <div [ngClass]="btnClass" class="position-relative" id="kt_drawer_chat_toggle">
    <app-keenicon name="message-text-2" class="fs-2"></app-keenicon>
    <span
      class="bullet bullet-dot bg-success h-6px w-6px position-absolute translate-middle top-0 start-50 animation-blink">
    </span>
  </div>
</div>
<!--end::Chat-->

<!--begin::Quick links-->
<div *ngIf="false" class="app-navbar-item" [ngClass]="itemClass">
  <!--begin::Menu wrapper-->
  <div [ngClass]="btnClass" data-kt-menu-trigger="click" data-kt-menu-attach="parent"
    data-kt-menu-placement="bottom-end">
    <app-keenicon name="element-11" class="fs-2"></app-keenicon>
  </div>
  <!--end::Menu wrapper-->
  <app-quick-links-inner></app-quick-links-inner>
</div>
<!--end::Quick links-->

<!--begin::Theme mode-->
<div *ngIf="false" class="app-navbar-item" [ngClass]="itemClass">
  <app-theme-mode-switcher [toggleBtnClass]="btnClass"
    toggleBtnClass="{`btn-active-light-primary btn-custom ${toolbarButtonHeightClass}`}"></app-theme-mode-switcher>
</div>
<!--end::Theme mode-->

<!--begin::User menu-->
<div *ngIf="false" class="app-navbar-item" [ngClass]="itemClass">
  <!--begin::Menu wrapper-->
  <div class="cursor-pointer symbol" [ngClass]="userAvatarClass" data-kt-menu-trigger="{default: 'click', lg: 'hover'}"
    data-kt-menu-attach="parent" data-kt-menu-placement="bottom-end">
    <img src="./assets/media/avatars/300-3.jpg" />
  </div>
  <app-user-inner data-kt-menu='true'></app-user-inner>
  <!--end::Menu wrapper-->
</div>
<!--end::User menu-->

<!--begin::Danh sách thông báo-->
<div *ngIf="true" class="app-navbar-item" [ngClass]="itemClass">
  <!--begin::Drawer toggle-->
  <div [ngClass]="btnClass" id="kt_drawer_notify_toggle">
    <app-keenicon name="notification-on" class="fs-2"></app-keenicon>
    <!-- <span class="badge" *ngIf="numberInfo > 0">{{ numberInfo > 9 ? '9+' : numberInfo }}</span> -->
    <span class="pulse-ring" *ngIf="numberInfo > 0"></span>
  </div>
  <app-notify-drawer (loadUnreadList)="updateNumberNoti($event)"></app-notify-drawer>
  <!--end::Drawer toggle-->
</div>
<!--end::Danh sách thông báo-->

<!--begin::Danh sách ứng dụng-->
<div *ngIf="true" class="app-navbar-item" [ngClass]="itemClass" style="margin-right: 2rem;">
  <!--begin::Menu wrapper-->
  <div [ngClass]="btnClass" data-kt-menu-trigger="click" data-kt-menu-attach="parent"
    data-kt-menu-placement="bottom-start">
    <app-keenicon name="element-11" class="fs-2"></app-keenicon>
  </div>
  <!--end::Menu wrapper-->
  <app-apps-links-inner></app-apps-links-inner>
</div>
<!--end::Danh sách ứng dụng-->

<!--begin::Thông tin người dùng-->
<div *ngIf="true" style="margin: 0 15px 0 30px; align-items: center; display: flex;">
  <div [ngClass]="btnClass" class="position-relative" id="kt_drawer_user_toggle">
    <ng-container *ngIf="this.user">
      <div class="btn btn-icon btn-icon-mobile w-auto btn-clean d-flex align-items-center btn-lg"
        style="margin: 0; background: #ebf5ed; border-radius: 50px; height: 50px">
        <span class="symbol symbol-lg-35 symbol-25 symbol-light-success me-2">
          <ngx-avatars src="{{ this.user['user']['customData']['personalInfo'].Avatar }}"
            *ngIf="this.user['user']['customData']['personalInfo'].Avatar; else bindText">
          </ngx-avatars>
          <ng-template #bindText>
            <ngx-avatars [textSizeRatio]="2.5" [name]="this.user['user']['customData']['personalInfo'].Name.slice(0, 1)"
              bgColor="{{ this.user['user']['customData']['personalInfo'].BgColor }}">
            </ngx-avatars>
          </ng-template>
        </span>
        <span class="text-dark-50 font-weight-bolder font-size-base d-none d-md-inline me-2">
          {{ this.user['user']['customData']['personalInfo'].Name }}
        </span>
        <span class="font-size-base d-none d-md-inline mr-3 nhacnho" *ngIf="SoLuongNhacNho > 0">
          {{ SoLuongNhacNho > 9 ? '9+' : SoLuongNhacNho }}
        </span>
      </div>
    </ng-container>
  </div>
</div>
<!--end::Thông tin người dùng-->

<!--begin::Header menu toggle-->
<ng-container *ngIf="appHeaderDefaulMenuDisplay">
  <div class="app-navbar-item d-lg-none ms-2 me-n3" title="Show header menu">
    <div class="btn btn-icon btn-active-color-primary w-35px h-35px" id="kt_app_header_menu_toggle">
      <app-keenicon name="element-4" class="fs-1" [ngClass]="btnIconClass"></app-keenicon>
    </div>
  </div>
</ng-container>
<!--end::Header menu toggle-->
