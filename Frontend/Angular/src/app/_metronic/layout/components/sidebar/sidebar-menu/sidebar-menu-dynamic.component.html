<!--begin::Menu wrapper-->
<div id="kt_app_sidebar_menu_scroll" class="scroll-y my-5 mx-3" data-kt-scroll="true" data-kt-scroll-activate="true"
  data-kt-scroll-height="auto" data-kt-scroll-dependencies="#kt_app_sidebar_logo, #kt_app_sidebar_footer"
  data-kt-scroll-wrappers="#kt_app_sidebar_menu" data-kt-scroll-offset="5px" data-kt-scroll-save-state="true">
  <!--begin::Menu-->
 

  <div class="menu menu-column menu-rounded menu-sub-indention fw-semibold fs-6" id="#kt_app_sidebar_menu"
    data-kt-menu="true" data-kt-menu-expand="false">
    <div class="menu-item">
      <a class="menu-link without-sub" routerLink="/dashboard" routerLinkActive="active">
        <span class="menu-icon">
          <app-keenicon name="element-11" class="fs-2"></app-keenicon>
        </span>
        <span class="menu-title">DASHBOARD</span>
      </a>
    </div>
    
    <ng-container *ngIf="menuConfig && menuConfig.items">
      <ng-container *ngFor="let item of menuConfig.items">
        <ng-container *ngIf="item.title" [ngTemplateOutlet]="menu1LevelTemplate"
          [ngTemplateOutletContext]="{ item: item }"></ng-container>
      </ng-container>
      <!--end::Menu Container-->
    </ng-container>
  </div>
  <!--end::Menu-->
</div>
<!--end::Menu wrapper-->
<!-- begin::1 Level -->
<ng-template #menu1LevelTemplate let-item="item">
  <!-- begin::if don't have submenu -->
  <ng-container *ngIf="!item.submenu">
    <div class="menu-item">
      <a class="menu-link without-sub" [routerLink]="item.page" routerLinkActive="active">
        <span class="menu-icon">
          <span class="bullet bullet-dot"></span>
        </span>
        <span class="menu-title" [translate]="item.translate">{{
          item.title
          }}</span>
      </a>
    </div>
  </ng-container>
  <!-- end::if don't have submenu -->

  <!-- begin::if has submenu -->
  <ng-container *ngIf="item.submenu">
    <div class="menu-item menu-accordion" data-kt-menu-trigger="click" routerLinkActive="here show">
      <span class="menu-link">
        <span class="menu-icon">
          <span class="svg-icon menu-icon">
            <i *ngIf="item.icon" class="kt-menu__link-icon" [ngClass]="item.icon"></i>
          </span>
        </span>
        <span class="menu-title" [translate]="item.translate">{{
          item.title
          }}
        </span>
        <span class="menu-arrow"></span>
      </span>
      <div class="menu-sub menu-sub-accordion" routerLinkActive="menu-active-bg">
        <div class="menu-item menu-accordion" routerLinkActive="here show" data-kt-menu-trigger="click">
          <ng-container *ngFor="let sub of item.submenu" [ngTemplateOutlet]="menu2LevelTemplate"
            [ngTemplateOutletContext]="{ item: sub }"></ng-container>
        </div>
      </div>
    </div>
  </ng-container>
  <!-- end::if has submenu -->
</ng-template>
<!-- end::1 Level -->

<!-- begin::2 Level -->
<ng-template #menu2LevelTemplate let-item="item">
  <!-- begin::if don't have submenu -->
  <ng-container *ngIf="!item.submenu">
    <div class="menu-item">
      <a class="menu-link without-sub" [routerLink]="item.page" routerLinkActive="active">
        <span class="menu-icon">
          <span class="bullet bullet-dot"></span>
        </span>
        <span class="menu-title" [translate]="item.translate">{{
          item.title
          }}</span>
      </a>
    </div>
  </ng-container>
  <!-- end::if don't have submenu -->

  <!-- begin::if has submenu -->
  <ng-container *ngIf="item.submenu">
    <div class="menu-item menu-accordion" data-kt-menu-trigger="click" routerLinkActive="here show">
      <span class="menu-link">
        <span class="menu-icon">
          <span class="svg-icon menu-icon">
            <!-- <i *ngIf="item.icon" class="kt-menu__link-icon" [ngClass]="item.icon"></i> -->
            <span class="bullet bullet-dot"></span>
          </span>
        </span>
        <span class="menu-title" [translate]="item.translate">{{
          item.title
          }}
        </span>
        <span class="menu-arrow"></span>
      </span>

      <div class="menu-sub menu-sub-accordion" routerLinkActive="menu-active-bg">
        <div class="menu-item menu-accordion" >
          <ng-container *ngFor="let sub of item.submenu" [ngTemplateOutlet]="menu3LevelTemplate"
            [ngTemplateOutletContext]="{ item: sub }"></ng-container>
        </div>
      </div>
    </div>
  </ng-container>
  <!-- end::if has submenu -->
</ng-template>
<!-- end::2 Level -->

<!-- begin::3 Level -->
<ng-template #menu3LevelTemplate let-item="item">
  <div class="menu-item">
    <a class="menu-link without-sub" [routerLink]="item.page" routerLinkActive="active">
      <span class="menu-icon">
        <span class="bullet bullet-dot"></span>
      </span>
      <span class="menu-title" [translate]="item.translate">{{
        item.title
        }}</span>
    </a>
  </div>
</ng-template>
<!-- end::3 Level -->

<!-- begin::Separator -->
<ng-template #menuItemSeparatorTemplate>
  <li class="menu-separator"><span></span></li>
</ng-template>
<!-- end::3 Separator -->

<!-- begin::Section -->
<ng-template #menuItemSectionTemplate let-item="item">
  <li class="menu-section">
    <h4 class="menu-text" [translate]="item.translate">{{ item.section }}</h4>
    <i class="menu-icon flaticon-more-v2"></i>
  </li>
</ng-template>
<!-- end::Section -->
