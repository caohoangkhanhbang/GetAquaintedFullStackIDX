<div id="kt_drawer_notify" class="bg-body" data-kt-drawer="true" data-kt-drawer-name="notify" data-kt-drawer-activate="true"
  data-kt-drawer-overlay="true" data-kt-drawer-width="{default:'300px', 'md': '385px'}" data-kt-drawer-direction="end"
  data-kt-drawer-toggle="#kt_drawer_notify_toggle" data-kt-drawer-close="#kt_drawer_notify_close">
  <div class="card w-100 rounded-0" id="kt_drawer_notify_messenger">
    <div class="card-header pe-5" id="kt_drawer_notify_messenger_header">
      <div class="card-title">
        <div class="d-flex justify-content-center flex-column me-3">
          <span class="
              fs-4
              fw-bolder
              text-gray-900 text-hover-primary
              me-1
              mb-2
              lh-1
              cursor-pointer
            ">{{
              'COMMON.thongbao' | translate
              }}</span>
        </div>
      </div>
      <div class="card-toolbar">
        <div class="me-2">
          <button class="btn btn-sm btn-icon btn-active-light-primary" data-kt-menu-trigger="click"
            data-kt-menu-placement="bottom-end" data-kt-menu-flip="top-end">
          </button>
        </div>
        <div class="btn btn-sm btn-icon btn-active-light-primary" id="kt_drawer_notify_close">
          <span class="svg-icon fs-2"></span>
          <app-keenicon name="cross" class="fs-2"></app-keenicon>
        </div>
      </div>
    </div>
    <!--begin::Content-->
    <div class="offcanvas-content p-xl-2">
      <div class="navi navi-icon-circle navi-spacer-x-0">
        <div class="container scroll pr-7 mr-n7 ps" style="position: relative">
          <div class="min-h-200px">
            <div *ngIf="listNoti && listNoti.length == 0">
              <div style="margin-left: 100px; margin-top: 50px">{{ 'COMMON.chuacothongbao' | translate }}</div>
            </div>
            <div *ngIf="listNoti && listNoti.length != 0">
              <div *ngFor="let noti of listNoti">
                <div class="d-flex align-items-center mb-6">
                  <div class="symbol symbol-40 symbol-light-primary " *ngIf="noti.message_json.Img != null">
                    <ngx-avatars [size]="45" src="{{ noti.message_json.Img }}"> </ngx-avatars>
                  </div>
                  <div class="d-flex flex-column ms-xxl-4">
                    <a
                      (click)="clickRead(noti)"
                      class="text-hover-primary mb-1 font-size-lg"
                      style="cursor: pointer"
                      [ngClass]="{ unread: !noti.isRead, read: noti.isRead }"
                    >
                      {{ noti.message_json.Content != null ? noti.message_json.Content : noti.message_text }}
                    </a>
                    <span [ngClass]="{ 'time-unread': !noti.isRead, 'time-read': noti.isRead }">{{ noti.createdDate }} </span>
                  </div>
                  <span *ngIf="!noti.isRead" class="dot"></span>
                </div>
                <hr style="color: #efefef" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!--end::Content-->
  </div>
</div>
